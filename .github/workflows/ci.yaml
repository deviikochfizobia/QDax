name: ci

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - name: Install project (dev)
        run: |
          uv pip install --system .[dev]

      - name: Run pre-commit
        run: "echo skipped-for-baseline-isolation"
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - name: Install project (dev + examples)
        run: |
          uv pip install --system .[dev,examples]

      - name: Run tests (coverage)
        run: |
          coverage run -m pytest -vv tests/core_test/aurora_test.py tests/baselines_test/cmaes_test.py tests/utils_test/metrics_test.py
          coverage xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
